function toolPage(id){
 const descriptions={
 "json-tool":["JSON Formatter","Validate JSON, then format it with indentation.","Paste JSON on the left and use Format or Minify."],
 "base64-tool":["Base64 Tool","Encode or decode text using the browser's Base64 functions.","UTF-8 text is supported."],
 "url-tool":["URL Encoder / Decoder","Encode or decode URL components safely.","Useful for query values and paths."],
 "html-escape":["HTML Escape Tool","Escape special characters before showing text as HTML.","This does not sanitize arbitrary HTML for every use case."],
 "text-diff":["Text Compare","Compare two text blocks by line.","A simple local comparison, not a full Git diff."],
 "word-count":["Text Statistics","Count characters, words, and lines.","Text stays in this browser."],
 "case-converter":["Case Converter","Convert text between common naming styles.","Useful for labels and identifiers."],
 "slug-tool":["Slug Generator","Create a URL-friendly slug.","Basic punctuation is removed."],
 "query-tool":["Query String Tool","Parse query-string key/value pairs.","Paste a query string or URL."],
 "regex-tool":["Regex Tester","Test a regular expression against sample text.","Regular expressions run locally in your browser."],
 "timestamp-tool":["Timestamp Converter","Convert Unix seconds or milliseconds to a date.","Uses your browser's local timezone for display."],
 "uuid-tool":["UUID Generator","Generate a random UUID using the browser crypto API when available.","Generated values are for development demos."]
 };
 const t=descriptions[id];if(!t)return null;
 let controls="";
 if(id==="json-tool")controls=`<div class="field"><label>JSON input</label><textarea id="toolInput" placeholder='{"hello":"world"}'></textarea></div><div class="row"><button class="btn primary" onclick="runTool('format')">Format</button><button class="btn" onclick="runTool('minify')">Minify</button><button class="btn" onclick="runTool('validate')">Validate</button></div>`;
 else if(id==="base64-tool")controls=`<div class="field"><label>Text input</label><textarea id="toolInput" placeholder="Text to encode or decode"></textarea></div><div class="row"><button class="btn primary" onclick="runTool('encode')">Encode Base64</button><button class="btn" onclick="runTool('decode')">Decode Base64</button></div>`;
 else if(id==="url-tool")controls=`<div class="field"><label>Input</label><textarea id="toolInput" placeholder="Enter text or a URL component"></textarea></div><div class="row"><button class="btn primary" onclick="runTool('encode')">Encode component</button><button class="btn" onclick="runTool('decode')">Decode component</button></div>`;
 else if(id==="text-diff")controls=`<div class="field"><label>Original text</label><textarea id="toolInput" placeholder="Original text"></textarea></div><div class="field"><label>New text</label><textarea id="toolInput2" placeholder="New text"></textarea></div><button class="btn primary" onclick="runTool('compare')">Compare</button>`;
 else if(id==="timestamp-tool")controls=`<div class="field"><label>Unix timestamp (seconds or milliseconds)</label><input id="toolInput" class="input" placeholder="e.g. 1735689600"></div><button class="btn primary" onclick="runTool('convert')">Convert</button>`;
 else if(id==="uuid-tool")controls=`<button class="btn primary" onclick="runTool('generate')">Generate UUID</button>`;
 else controls=`<div class="field"><label>Input text</label><textarea id="toolInput" placeholder="Paste text here"></textarea></div><button class="btn primary" onclick="runTool('${id}')">Convert</button>`;
 return `${pageHead(t[0],t[1],"DEVELOPER TOOLS")}<div class="toolbox"><p>${t[2]}</p>${controls}<div class="field"><label>Output</label><textarea id="toolOutput" readonly placeholder="Results appear here"></textarea></div><div class="row"><button class="btn small" onclick="copyOutput()">Copy output</button><span id="toolStatus" class="muted" style="font-size:11px"></span></div></div>`;
}
function runTool(mode){
 const id=current, inp=$("#toolInput")?.value??"", out=$("#toolOutput"), status=$("#toolStatus");let result="";
 try{
  if(id==="json-tool"){const parsed=JSON.parse(inp);result=mode==="minify"?JSON.stringify(parsed):mode==="validate"?"Valid JSON ✓":JSON.stringify(parsed,null,2)}
  else if(id==="base64-tool"){if(mode==="encode"){const bytes=new TextEncoder().encode(inp);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));result=btoa(bin)}else{const bin=atob(inp.trim());const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));result=new TextDecoder().decode(bytes)}}
  else if(id==="url-tool")result=mode==="encode"?encodeURIComponent(inp):decodeURIComponent(inp);
  else if(id==="html-escape")result=inp.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  else if(id==="text-diff"){const a=inp.split("\n"),b=($("#toolInput2")?.value||"").split("\n");result="ORIGINAL / NEW LINE COMPARISON\n"+Array.from({length:Math.max(a.length,b.length)},(_,i)=>(a[i]===b[i]?"  ":a[i]===undefined?"+ ":b[i]===undefined?"- ":"~ ")+(a[i]??"")+"  "+(b[i]??"")).join("\n")}
  else if(id==="word-count")result=`Characters: ${inp.length}\nCharacters (no spaces): ${inp.replace(/\s/g,"").length}\nWords: ${(inp.trim().match(/\S+/g)||[]).length}\nLines: ${inp?inp.split(/\r\n|\r|\n/).length:0}`;
  else if(id==="case-converter")result=`UPPERCASE: ${inp.toUpperCase()}\nlowercase: ${inp.toLowerCase()}\ncamelCase: ${inp.trim().toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase())}\nsnake_case: ${inp.trim().replace(/([a-z0-9])([A-Z])/g,"$1_$2").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}\n kebab-case: ${inp.trim().replace(/([a-z0-9])([A-Z])/g,"$1-$2").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}`;
  else if(id==="slug-tool")result=inp.normalize("NFKD").toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/[\s_-]+/g,"-");
  else if(id==="query-tool"){const raw=inp.includes("?")?inp.slice(inp.indexOf("?")+1).split("#")[0]:inp.replace(/^\?/,"");const p=new URLSearchParams(raw);result=[...p.entries()].map(([k,v])=>`${k} = ${v}`).join("\n")||"(no query parameters)"}
  else if(id==="regex-tool"){const lines=inp.split("\n");const pattern=lines.shift()||"";const m=lines.join("\n").match(new RegExp(pattern,"gm"));result=m?m.join("\n"):"No matches"}
  else if(id==="timestamp-tool"){let n=Number(inp);if(!Number.isFinite(n))throw Error("Enter a numeric timestamp.");if(Math.abs(n)<1e12)n*=1000;const d=new Date(n);if(Number.isNaN(d.getTime()))throw Error("Timestamp is outside the supported range.");result=`ISO: ${d.toISOString()}\nLocal: ${d.toLocaleString()}\nUnix seconds: ${Math.floor(d.getTime()/1000)}`}
  else if(id==="uuid-tool")result=crypto.randomUUID?crypto.randomUUID():"UUID generation is not supported by this browser.";
  else result=inp;
  out.value=result;status.textContent=mode==="validate"?"Valid JSON.":"Done.";status.className="success";
 }catch(e){out.value="";status.textContent=e.message||"Could not process input.";status.className="error"}
}
function copyOutput(){const t=$("#toolOutput");if(!t)return;t.select();try{document.execCommand("copy");$("#toolStatus").textContent="Copied to clipboard."}catch{$("#toolStatus").textContent="Select the output and copy it."}}
function codePlayground(){
 return `${pageHead("Code Playground","Write a small HTML/CSS/JavaScript prototype and run it in a sandboxed preview.","CODE LAB")}
 <div class="toolbox"><div class="field"><label>HTML</label><textarea id="playHTML"><main><h1>Hello, BUCKET_SHOGUN</h1><p>Your preview runs in an isolated frame.</p><button onclick="document.querySelector('p').textContent='Button works!'">Test button</button></main></textarea></div><div class="field"><label>CSS</label><textarea id="playCSS">body{font-family:system-ui;padding:2rem;background:#0d1726;color:#e6edf7}button{padding:.6rem 1rem;border-radius:8px;border:1px solid #5786c1;background:#193a60;color:white}</textarea></div><div class="field"><label>JavaScript</label><textarea id="playJS">console.log('Hello from the playground');</textarea></div><div class="row"><button class="btn primary" onclick="runPlayground()">Run preview</button><button class="btn" onclick="resetPlayground()">Reset example</button></div><div class="field"><label>Preview</label><iframe id="playPreview" title="Code preview" sandbox="allow-scripts" style="width:100%;height:320px;background:#fff;border:1px solid var(--line);border-radius:8px"></iframe></div></div>`;
}
function runPlayground(){const h=$("#playHTML").value,c=$("#playCSS").value,j=$("#playJS").value;const doc=`<!doctype html><html><head><meta charset="utf-8"><style>${c.replace(/<\/style/gi,"<\\/style")}</style></head><body>${h.replace(/<\/script/gi,"<\\/script")}<script>${j.replace(/<\/script/gi,"<\\/script")}<\/script></body></html>`;$("#playPreview").srcdoc=doc;}
function resetPlayground(){openPage("code-playground")}
function settingsPage(){
 return `${pageHead("Settings","Control navigation visibility, ordering, and local preferences.","SYSTEM / CONFIGURATION")}
 <div class="grid"><article class="card wide"><h3>Navigation visibility</h3><p>Toggle modules on or off. Settings stays available so you can restore hidden entries.</p><div class="itemlist" style="margin-top:12px">${CATALOG.map(x=>`<div class="itemrow"><span>${safe(x.label)} <small>· ${safe(x.group)}</small></span><label><input class="toggle" type="checkbox" ${prefs.hidden.includes(x.id)?"":"checked"} onchange="toggleItem('${x.id}',this.checked)" aria-label="Show ${safe(x.label)}"></label></div>`).join("")}</div></article><article class="card"><h3>Local preferences</h3><p>Saved only in this browser using localStorage.</p><div class="settingsrow"><div><b>Reset preferences</b><small>Restore default sidebar visibility and order.</small></div><button class="btn small" onclick="resetPrefs()">Reset</button></div><div class="settingsrow"><div><b>Export settings</b><small>Download a JSON backup of navigation preferences.</small></div><button class="btn small" onclick="exportPrefs()">Export</button></div><div class="settingsrow"><div><b>Restore settings</b><small>Import a previously exported JSON file.</small></div><label class="btn small">Choose file<input type="file" accept=".json,application/json" hidden onchange="importPrefs(event)"></label></div><div class="notice">Changing settings here does not change other browsers or devices.</div></article></div>
 <div class="toolbox"><h2>Reorder modules</h2><p>Use the arrows to change the sidebar order. The order is saved locally.</p><div class="itemlist">${prefs.order.map((id,i)=>{const x=getItem(id);return `<div class="itemrow"><span>${safe(x.label)} <small>· ${safe(x.group)}</small></span><button class="btn small" ${i===0?"disabled":""} onclick="moveItem('${id}',-1)">↑</button><button class="btn small" ${i===prefs.order.length-1?"disabled":""} onclick="moveItem('${id}',1)">↓</button></div>`}).join("")}</div></div>`;
}
function toggleItem(id,on){if(id==="settings"&&!on){alert("Settings stays visible so you can restore hidden modules.");return}prefs.hidden=on?prefs.hidden.filter(x=>x!==id):[...new Set([...prefs.hidden,id])];savePrefs();renderNav();if(prefs.hidden.includes(current))openPage("dashboard");else openPage(current)}
function moveItem(id,dir){const i=prefs.order.indexOf(id),j=i+dir;if(j<0||j>=prefs.order.length)return;[prefs.order[i],prefs.order[j]]=[prefs.order[j],prefs.order[i]];savePrefs();renderNav();openPage("settings")}
function resetPrefs(){if(!confirm("Reset sidebar preferences?"))return;prefs={...defaultPrefs,hidden:[],order:CATALOG.map(x=>x.id),groupCollapsed:[],favorites:["dashboard","json-tool","code-playground","game-hub"]};savePrefs();renderNav();openPage("settings")}
function exportPrefs(){const blob=new Blob([JSON.stringify(prefs,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bucket-shogun-settings.json";a.click();URL.revokeObjectURL(a.href)}
function importPrefs(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);prefs={...defaultPrefs,...p};prefs.order=[...new Set([...(prefs.order||[]),...CATALOG.map(x=>x.id)])].filter(id=>getItem(id));prefs.hidden=(prefs.hidden||[]).filter(id=>id!=="settings"&&getItem(id));savePrefs();renderNav();openPage("settings")}catch{alert("That settings file is not valid JSON.")}};r.readAsText(f)}
function adminPage(){return `${pageHead("Admin Panel","Management interface scaffold. Real authentication must be configured before admin writes are enabled.","ADMIN / SETUP")}<div class="notice">SECURITY NOTE: This file is public. It intentionally does not contain a password or pretend to authenticate you. Connect Firebase Authentication and enforce Firestore Security Rules before enabling real admin access.</div><div class="grid"><article class="card wide"><h3>Admin connection status</h3><div class="metric" style="font-size:20px">NOT CONNECTED</div><p>This interface does not currently sign in or write to a database. A secure Firebase setup requires your own project configuration, authentication provider, and UID-restricted database rules.</p><div class="row" style="margin-top:14px"><button class="btn" onclick="openExternal('https://console.firebase.google.com/')">Open Firebase Console ↗</button><button class="btn" onclick="openPage('deployment')">Hosting checklist</button></div></article><article class="card"><h3>Admin checklist</h3><p>1. Create Firebase project<br>2. Enable Email/Password sign-in<br>3. Add Firestore<br>4. Restrict writes to your authenticated UID<br>5. Test rules before publishing</p></article></div>`}
function apiTester(){return `${pageHead("API Tester","Send a GET request to a public API from your browser. CORS policy may prevent some requests.","API MANAGEMENT")}<div class="toolbox"><div class="field"><label>Request URL</label><input class="input" id="apiURL" value="https://jsonplaceholder.typicode.com/todos/1"></div><button class="btn primary" onclick="sendAPI()">Send GET</button><div class="field"><label>Response</label><textarea id="apiResponse" readonly placeholder="Response body and status will appear here"></textarea></div><div id="apiStatus" class="muted"></div></div>`}
async function sendAPI(){const u=$("#apiURL").value;$("#apiStatus").textContent="Requesting…";try{const r=await fetch(u);const t=await r.text();$("#apiResponse").value=t;$("#apiStatus").textContent=`HTTP ${r.status} ${r.statusText}`}catch(e){$("#apiResponse").value="";$("#apiStatus").textContent="Request blocked or failed. The API may require CORS support, authentication, or a valid URL."}}
function referencePage(id){
 const titles={
 "git-commands":["Git Commands","Common commands for working with repositories."],
 "git-dashboard":["Git Dashboard","A reference dashboard for repository workflows."],
 "github-guide":["GitHub Guide","Repository, commit, branch, and pull request basics."],
 "deployment":["Deployment Checklist","A short checklist for publishing a static site."],
 "security-basics":["Security Basics","Keep credentials and user data safe."],
 "secrets-guide":["Secrets Safety","Never commit passwords, tokens, or private keys."],
 "firebase-notes":["Firebase Notes","Firebase can provide authentication, a database, and hosting."],
 "hosting-notes":["Hosting Notes","GitHub Pages serves static files; Firebase Hosting is another free-tier option."],
 "rest-guide":["REST Guide","REST APIs commonly use HTTP methods and JSON responses."],
 "status-codes":["HTTP Status Codes","Quick reference for common HTTP responses."],
 "cors-guide":["CORS Guide","Browsers enforce cross-origin rules set by the target server."],
 "auth-guide":["Authentication Reference","Authentication proves who a user is; authorization controls what they can do."],
 "pages-notes":["Pages & Hosting","Static hosting can publish HTML, CSS, and client-side JavaScript."],
 "getting-started":["Getting Started","Use the sidebar to open a module, then use Settings to customize navigation."],
 "faq":["FAQ","This is a static client-side workspace; server features require separate setup."],
 "troubleshooting":["Troubleshooting","If a module fails, reload first, then check the browser console and provider status."],
 "about":["About This Console","BUCKET_SHOGUN is a single-file developer dashboard prototype."],
 "secret-archive":["Secret Archive","A small hidden-feeling archive of harmless local experiments."],

 "easter-egg-3":["Secret Archive","Archive entries are local interface demos, not a secure vault."]
 };
 const d=titles[id]||[getItem(id)?.label||"Module", "Reference notes and a local workspace scaffold for this module."];
 let body="";
 if(id==="git-commands")body=`<table class="table"><thead><tr><th>Command</th><th>Purpose</th></tr></thead><tbody>${[["git status","See changed files"],["git add .","Stage changes"],["git commit -m \"message\"","Save a snapshot"],["git pull","Fetch and integrate remote changes"],["git push","Send commits to remote"],["git branch","List branches"],["git log --oneline","Compact commit history"],["git diff","Inspect unstaged changes"]].map(x=>`<tr><td><code>${safe(x[0])}</code></td><td>${safe(x[1])}</td></tr>`).join("")}</tbody></table>`;
 else if(id==="deployment")body=`<ul><li>Check that <code>index.html</code> is in the repository root.</li><li>Confirm the hosting source branch and folder.</li><li>Wait for the latest deployment to complete.</li><li>Test the published URL in a private window.</li><li>Never put credentials in the public repository.</li></ul>`;
 else if(id==="security-basics"||id==="secrets-guide"||id==="auth-guide")body=`<ul><li>Do not put passwords, private keys, or API secrets in client-side JavaScript.</li><li>Use authentication for identity and database rules for authorization.</li><li>Grant the minimum permissions required.</li><li>Do not treat a hidden button as a security boundary.</li></ul>`;
 else body=`<div class="code">${safe(d[1])}\n\nModule: ${safe(id)}\nCategory: ${safe(getItem(id)?.group||"General")}\nMode: local reference</div><div class="row" style="margin-top:12px"><button class="btn" onclick="openPage('dashboard')">Return to dashboard</button><button class="btn" onclick="openPage('settings')">Open settings</button></div>`;
 return `${pageHead(d[0],d[1],getItem(id)?.group||"REFERENCE")}<div class="toolbox">${body}</div>`;
}
function genericPage(id){const x=getItem(id);return `${pageHead(x.label,`Workspace module for ${x.group.toLowerCase()}. This module is a local scaffold; use the linked utilities and reference pages for working features.`,x.group.toUpperCase())}<div class="grid"><article class="card wide"><h3>${safe(x.label)} workspace</h3><p>This section is ready for notes and future features. The current version is fully client-side and does not send your content to a server.</p><div class="row" style="margin-top:14px"><button class="btn primary" onclick="openPage('code-playground')">Open Code Playground</button><button class="btn" onclick="openPage('json-tool')">Open JSON Formatter</button><button class="btn" onclick="openPage('settings')">Settings</button></div></article><article class="card"><h3>Module metadata</h3><div class="code">id: ${safe(x.id)}\ncategory: ${safe(x.group)}\nstatus: scaffolded\nmode: local-demo</div></article></div>`}
function openPage(id){
 const x=getItem(id);if(!x)return;current=id;$("#crumb").textContent=x.label;$("#sidebar").classList.remove("open");renderNav();
 if(id==="dashboard")view.innerHTML=dashboard();
 else if(id==="game-hub")view.innerHTML=gameHub();
 else if(games[id])view.innerHTML=`${pageHead(games[id].title,games[id].desc,"GAMES / EMBED")}<div class="toolbox"><div class="row"><button class="btn primary" onclick="loadGame('${id}')">Load game here</button><button class="btn" onclick="openExternal('${games[id].url}')">Open host ↗</button></div><div id="gameFrameWrap" class="gameframewrap"><p class="muted">Click “Load game here” to attempt an embedded view.</p></div></div>`;
 else if(id==="polytrack-addons")view.innerHTML=`${pageHead("PolyTrack Tracks & Add-ons","Use the official editor and import/export tracks; community builds are third-party.","GAMES / ADD-ONS")}<div class="toolbox"><h2>Track tools</h2><p>PolyTrack includes a built-in track editor on the official host. Community modifications are not controlled by BUCKET_SHOGUN.</p><div class="row"><button class="btn primary" onclick="loadGame('polytrack')">Open official PolyTrack here</button><button class="btn" onclick="openExternal('https://www.kodub.com/apps/polytrack')">Official host ↗</button><button class="btn" onclick="openExternal('https://github.com/Yinnotayl/Polytrack')">Community mod page ↗</button></div></div>`;
 else if(id==="settings")view.innerHTML=settingsPage();
 else if(id==="code-playground")view.innerHTML=codePlayground();
 else if(id==="admin-panel"||id==="content-manager")view.innerHTML=adminPage();
 else if(id==="api-tester"||id==="request-builder")view.innerHTML=apiTester();
 else if(toolPage(id)!==null)view.innerHTML=toolPage(id);
 else view.innerHTML=referencePage(id);
 if(id==="code-playground")runPlayground();
 window.scrollTo({top:0,behavior:"smooth"});
}
$("#navSearch").addEventListener("input",renderNav);
$("#homeBtn").onclick=()=>openPage("dashboard");
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("#navSearch").focus()}if(e.key==="Escape")$("#sidebar").classList.remove("open")});
if(CATALOG.length!==137)console.error("Catalog must contain exactly 137 items, Settings included:",CATALOG.length);
renderNav();openPage("dashboard");
